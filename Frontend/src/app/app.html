<div class="flex h-screen bg-[#f4f7fe] text-slate-800 font-sans selection:bg-emerald-100 selection:text-emerald-700">

  <!-- SIDEBAR -->
  <aside class="w-100 bg-white flex flex-col flex-shrink-0 relative z-20">
    <div class="p-8 flex items-center gap-3">
      <h1 class="text-3xl font-black tracking-tight text-slate-900">Inventory manage</h1>
    </div>

    <nav class="flex-1 px-4 py-2 space-y-2 mt-4">
      <a routerLink="/dashboard" routerLinkActive="text-brand" [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center justify-between px-4 py-3 text-slate-400 hover:text-slate-900 transition-colors font-bold group">
        <div class="flex items-center gap-4">
          <svg class="w-5 h-5 group-[.text-brand]:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
          <span>Dashboard</span>
        </div>
        <div class="w-2 h-2 rounded-full bg-brand hidden group-[.text-brand]:block"></div>
      </a>
      <a routerLink="/employees" routerLinkActive="text-brand" [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center justify-between px-4 py-3 text-slate-400 hover:text-slate-900 transition-colors font-bold group">
        <div class="flex items-center gap-4">
          <svg class="w-5 h-5 group-[.text-brand]:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <span>Employee</span>
        </div>
        <div class="w-2 h-2 rounded-full bg-brand hidden group-[.text-brand]:block"></div>
      </a>
      <a routerLink="/inventory" routerLinkActive="text-brand" [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center justify-between px-4 py-3 text-slate-400 hover:text-slate-900 transition-colors font-bold group">
        <div class="flex items-center gap-4">
          <svg class="w-5 h-5 group-[.text-brand]:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
          </svg>
          <span>Products</span>
        </div>
        <div class="w-2 h-2 rounded-full bg-brand hidden group-[.text-brand]:block"></div>
      </a>
      <a routerLink="/sales" routerLinkActive="text-brand" [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center justify-between px-4 py-3 text-slate-400 hover:text-slate-900 transition-colors font-bold group">
        <div class="flex items-center gap-4">
          <svg class="w-5 h-5 group-[.text-brand]:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          <span>Transaction</span>
        </div>
        <div class="w-2 h-2 rounded-full bg-brand hidden group-[.text-brand]:block"></div>
      </a>
      <a routerLink="/purchases" routerLinkActive="text-brand" [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center justify-between px-4 py-3 text-slate-400 hover:text-slate-900 transition-colors font-bold group">
        <div class="flex items-center gap-4">
          <svg class="w-5 h-5 group-[.text-brand]:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span>Orders</span>
        </div>
        <div class="w-2 h-2 rounded-full bg-brand hidden group-[.text-brand]:block"></div>
      </a>
      <a routerLink="/customers" routerLinkActive="text-brand" [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center justify-between px-4 py-3 text-slate-400 hover:text-slate-900 transition-colors font-bold group">
        <div class="flex items-center gap-4">
          <svg class="w-5 h-5 group-[.text-brand]:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span>Customer</span>
        </div>
        <div class="w-2 h-2 rounded-full bg-brand hidden group-[.text-brand]:block"></div>
      </a>
      <a routerLink="/suppliers" routerLinkActive="text-brand" [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center justify-between px-4 py-3 text-slate-400 hover:text-slate-900 transition-colors font-bold group">
        <div class="flex items-center gap-4">
          <svg class="w-5 h-5 group-[.text-brand]:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <span>Suppliers</span>
        </div>
        <div class="w-2 h-2 rounded-full bg-brand hidden group-[.text-brand]:block"></div>
      </a>
      <a routerLink="/categories" routerLinkActive="text-brand" [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center justify-between px-4 py-3 text-slate-400 hover:text-slate-900 transition-colors font-bold group">
        <div class="flex items-center gap-4">
          <svg class="w-5 h-5 group-[.text-brand]:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span>Categories</span>
        </div>
        <div class="w-2 h-2 rounded-full bg-brand hidden group-[.text-brand]:block"></div>
      </a>
    </nav>

    <div class="p-6 mt-auto">
      <div class="bg-brand rounded-2xl p-6 text-white text-center shadow-xl shadow-brand/20 relative overflow-hidden">
        <div class="absolute -top-4 -right-4 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
        <div class="w-16 h-16 mx-auto mb-2 text-4xl">🚀</div>
        <p class="text-sm font-bold leading-tight mb-4">Become A Pro To Get More Features</p>
        <button
          class="px-4 py-2 bg-white text-brand rounded-lg text-sm font-bold shadow-md hover:scale-105 transition-transform">
          Upgrade Now
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden">

    <!-- TOP BAR -->
    <header class="h-24 flex items-center justify-between px-8 bg-[#f4f7fe] shrink-0">
      <div>
        <h2 class="text-3xl font-black text-slate-800 tracking-tight">Dashboard</h2>
        <p class="text-slate-400 text-sm font-medium mt-1">11-11-2022</p>
      </div>

      <div class="flex items-center gap-6">
        <div class="relative w-80">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" placeholder="Search"
            class="w-full pl-12 pr-4 py-3 bg-white rounded-2xl outline-none text-sm font-medium placeholder:text-slate-300 shadow-sm">
        </div>

        <div class="flex items-center gap-3">
          <button
            class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-slate-400 shadow-sm relative">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <div class="absolute top-2 right-2.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></div>
          </button>
          <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-slate-400 shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
          <img src="https://ui-avatars.com/api/?name=Admin+User&background=1e293b&color=fff" alt="Avatar"
            class="w-10 h-10 rounded-full shadow-sm ml-2">
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <div class="flex-1 overflow-y-auto px-8 pb-8 custom-scrollbar">
      <router-outlet></router-outlet>
    </div>

  </main>
</div>
